name: Deploy Backend to Azure App Service (container)

# Required repository configuration:
#   Secret:   AZURE_CREDENTIALS (azure/login service principal JSON)
#   Variables: AZURE_ACR_NAME, AZURE_RESOURCE_GROUP
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: lnett-webapp-infrasight1-api
  FRONTEND_WEBAPP_NAME: lnett-webapp-infrasight1
  BACKEND_PATH: backend
  IMAGE_NAME: infrasight-backend
  APP_PORT: '8000'

jobs:
  build-and-deploy:
    name: Build image and deploy backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          if [ -z "${ACR_NAME}" ]; then
            echo "::error::Variable AZURE_ACR_NAME is not set."
            exit 1
          fi
          acr_login_server=$(az acr show --name "${ACR_NAME}" --query loginServer -o tsv)
          az acr login --name "${ACR_NAME}"
          echo "ACR_LOGIN_SERVER=${acr_login_server}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_PATH }}
          file: ${{ env.BACKEND_PATH }}/Dockerfile
          load: true
          push: false
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts the built image and checks the API answers and exposes the graph route.
      # Neo4j is not contacted at startup, so placeholder values are sufficient here.
      - name: Smoke test image
        env:
          IMAGE: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 8000:8000 \
            -e NEO4J_URI=bolt://127.0.0.1:7687 \
            -e NEO4J_USER=smoke \
            -e NEO4J_PASSWORD=smoke \
            "${IMAGE}")
          trap 'docker logs "${cid}" || true; docker rm -f "${cid}" > /dev/null' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/openapi.json | grep -q '/sub_graph'

      - name: Push image to registry
        env:
          IMAGE: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: docker push "${IMAGE}"

      # Points the web app at the pushed image. The App Service pulls it with its
      # system-assigned managed identity, which needs the AcrPull role on the registry.
      - name: Configure App Service
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
          FRONTEND_WEBAPP_NAME: ${{ env.FRONTEND_WEBAPP_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ env.ACR_LOGIN_SERVER }}
          IMAGE: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            if [ -z "${RESOURCE_GROUP}" ]; then
              echo "::error::Variable AZURE_RESOURCE_GROUP is not set."
              exit 1
            fi

            # Ensure the app has a managed identity and that it may pull from the registry.
            principal_id=$(az webapp identity assign \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --query principalId -o tsv)
            acr_id=$(az acr show --name "${ACR_NAME}" --query id -o tsv)
            if [ -z "$(az role assignment list --assignee "${principal_id}" --role AcrPull \
                --scope "${acr_id}" --query '[0].id' -o tsv)" ]; then
              az role assignment create --assignee-object-id "${principal_id}" \
                --assignee-principal-type ServicePrincipal \
                --role AcrPull --scope "${acr_id}" --output none \
                || echo "::warning::Could not grant AcrPull to ${AZURE_WEBAPP_NAME}. Grant it manually or the image pull will fail."
            fi

            az resource update \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-type Microsoft.Web/sites \
              --set properties.siteConfig.acrUseManagedIdentityCreds=true \
              --output none

            az webapp config container set \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --container-image-name "${IMAGE}" \
              --container-registry-url "https://${ACR_LOGIN_SERVER}" \
              --output none

            # Clear any startup command left over from the zip deployment; in container
            # mode it would override the image's CMD.
            az webapp config set \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --startup-file "" \
              --output none

            # WEBSITES_PORT tells App Service which container port to route to.
            # SCM_DO_BUILD_DURING_DEPLOYMENT is no longer needed (the image has its dependencies).
            az webapp config appsettings set \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --settings WEBSITES_PORT="${APP_PORT}" SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              --output none

            # Default CORS to the frontend's hostname unless it has been set manually.
            existing_cors=$(az webapp config appsettings list \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --query "[?name=='CORS_ALLOWED_ORIGINS'].value | [0]" -o tsv)
            if [ -z "${existing_cors}" ]; then
              frontend_host=$(az webapp show \
                --name "${FRONTEND_WEBAPP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" \
                --query defaultHostName -o tsv)
              az webapp config appsettings set \
                --name "${AZURE_WEBAPP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" \
                --settings CORS_ALLOWED_ORIGINS="https://${frontend_host}" \
                --output none
              echo "Set CORS_ALLOWED_ORIGINS=https://${frontend_host}"
            else
              echo "CORS_ALLOWED_ORIGINS already set: ${existing_cors}"
            fi

            # Warn early if the Neo4j settings the app needs at import time are missing.
            for name in NEO4J_URI NEO4J_USER NEO4J_PASSWORD; do
              value=$(az webapp config appsettings list \
                --name "${AZURE_WEBAPP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" \
                --query "[?name=='${name}'].name | [0]" -o tsv)
              if [ -z "${value}" ]; then
                echo "::warning::App setting ${name} is not configured on ${AZURE_WEBAPP_NAME}; the API will fail to start."
              fi
            done

            az webapp restart \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --output none

      - name: Verify deployment
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            host=$(az webapp show --name "${AZURE_WEBAPP_NAME}" --resource-group "${RESOURCE_GROUP}" \
              --query defaultHostName -o tsv)
            for i in $(seq 1 30); do
              if curl -fsS "https://${host}/openapi.json" > /dev/null; then
                echo "Backend is responding at https://${host}"
                exit 0
              fi
              sleep 10
            done
            echo "::error::Backend did not respond at https://${host} after deployment."
            exit 1

      - name: Azure logout
        if: always()
        run: az logout || true
